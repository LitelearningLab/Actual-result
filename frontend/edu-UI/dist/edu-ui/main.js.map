<aside
  class="app-side-nav"
  [class.collapsed]="collapsed"
  *ngIf="isLogin"
  role="navigation"
  aria-label="Main navigation"
>
  <!-- Top -->
  <div class="side-top">
    <div class="logo-wrap">
      <img
        *ngIf="!collapsed"
        class="institute-logo institute-logo-expanded"
        src="/assets/images/logo-main.png"
        alt="Institute logo"
        loading="lazy"
      />
      <img
        *ngIf="collapsed"
        class="institute-logo institute-logo-collapsed"
        src="/assets/images/logo.png"
        alt=""
        loading="lazy"
      />
    </div>
    <button
      class="collapse-toggle"
      (click)="toggleCollapse()"
      [attr.aria-expanded]="!collapsed"
      [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      [matTooltip]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      [matTooltipDisabled]="!collapsed"
      matTooltipPosition="right"
      matTooltipClass="sidenav-stylish-tooltip"
      matTooltipShowDelay="100"
    >
      <mat-icon class="collapse-icon">{{ collapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="menu" role="menubar" aria-label="Main menu">
    <ng-container *ngFor="let m of menus">
      <a
        [routerLink]="m.path"
        class="menu-item"
        role="menuitem"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        (click)="onMenuClick(m)"
        [ngClass]="{ active: selectedMenu === m.label }"
        [attr.aria-current]="selectedMenu === m.label ? 'page' : null"
        [attr.data-tooltip]="m.label"
        [matTooltip]="m.label"
        [matTooltipDisabled]="!collapsed"
        matTooltipPosition="right"
        matTooltipClass="sidenav-stylish-tooltip"
        matTooltipShowDelay="100"
      >
        <span class="menu-icon-wrap">
          <mat-icon class="menu-icon" svgIcon="{{ m.icon || 'menu' }}"></mat-icon>
        </span>
        <span class="menu-label" *ngIf="!collapsed">{{ m.label }}</span>
      </a>
    </ng-container>
  </nav>

  <!-- Footer -->
  <footer class="side-bottom" *ngIf="!collapsed">
    <p class="app-version">
      <span class="version-label">v{{ appVersion }}</span>
      <span class="copyright">&copy; 2026 Profluent Labs</span>
    </p>
  </footer>

  <ng-content></ng-content>
</aside>
