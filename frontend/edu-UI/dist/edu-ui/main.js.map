<div class="mobile-nav-backdrop" *ngIf="isMobileOpen" (click)="closeMobile()" (touchstart)="closeMobile()" aria-hidden="true"></div>

<aside
  class="app-side-nav"
  [class.collapsed]="collapsed"
  [class.mobile-open]="isMobileOpen"
  *ngIf="isLogin"
  role="navigation"
  aria-label="Main navigation"
  (touchstart)="onTouchStart($event)"
  (touchmove)="onTouchMove($event)"
  (touchend)="onTouchEnd($event)"
  [style.transform]="drawerTransform"
>
  <!-- Top -->
  <div class="side-top">
    <div class="logo-wrap">
      <img
        *ngIf="!collapsed || isMobileOpen"
        class="institute-logo institute-logo-expanded"
        src="/assets/images/logo-main.png"
        alt="Institute logo"
        loading="lazy"
      />
      <img
        *ngIf="collapsed && !isMobileOpen"
        class="institute-logo institute-logo-collapsed"
        src="/assets/images/logo.png"
        alt=""
        loading="lazy"
      />
    </div>
    <button
      class="collapse-toggle desktop-toggle"
      (click)="toggleCollapse()"
      [attr.aria-expanded]="!collapsed"
      [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      [matTooltip]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      [matTooltipDisabled]="!collapsed || isMobileOpen"
      matTooltipPosition="right"
      matTooltipClass="sidenav-stylish-tooltip"
      matTooltipShowDelay="100"
    >
      <mat-icon class="collapse-icon">{{ collapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
    <button
      type="button"
      class="mobile-close-btn"
      (click)="closeMobile()"
      aria-label="Close menu"
    >
      <mat-icon class="close-icon">close</mat-icon>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="menu" role="menubar" aria-label="Main menu">
    <ng-container *ngFor="let item of navItems">
      <!-- Standalone Menu Item -->
      <a
        *ngIf="!item.isGroup"
        [routerLink]="item.path"
        class="menu-item"
        role="menuitem"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        (click)="onMenuClick(item)"
        [ngClass]="{ active: selectedMenu === item.label }"
        [attr.aria-current]="selectedMenu === item.label ? 'page' : null"
        [attr.data-tooltip]="item.label"
        [matTooltip]="item.label"
        [matTooltipDisabled]="!collapsed || isMobileOpen"
        matTooltipPosition="right"
        matTooltipClass="sidenav-stylish-tooltip"
        matTooltipShowDelay="100"
      >
        <span class="menu-icon-wrap">
          <mat-icon class="menu-icon" [svgIcon]="item.icon || 'menu'"></mat-icon>
        </span>
        <span class="menu-label" *ngIf="!collapsed || isMobileOpen">{{ item.label }}</span>
      </a>

      <!-- Collapsible Accordion Group -->
      <div
        *ngIf="item.isGroup"
        class="menu-group"
        [class.is-expanded]="isGroupExpanded(item.label)"
        [class.has-active-child]="isGroupActive(item)"
      >
        <!-- Parent Group Header -->
        <button
          type="button"
          class="menu-item group-header"
          [class.expanded]="isGroupExpanded(item.label)"
          [class.active-parent]="isGroupActive(item)"
          (click)="onGroupClick(item)"
          [attr.aria-expanded]="isGroupExpanded(item.label)"
          [attr.aria-label]="item.label"
          [attr.data-tooltip]="item.label"
          [matTooltip]="item.label"
          [matTooltipDisabled]="!collapsed || isMobileOpen"
          matTooltipPosition="right"
          matTooltipClass="sidenav-stylish-tooltip"
          matTooltipShowDelay="100"
        >
          <span class="menu-icon-wrap">
            <mat-icon class="menu-icon" [svgIcon]="item.icon || 'menu'"></mat-icon>
          </span>
          <span class="menu-label group-label" *ngIf="!collapsed || isMobileOpen">{{ item.label }}</span>
          <mat-icon
            class="group-chevron"
            *ngIf="!collapsed || isMobileOpen"
          >
            expand_more
          </mat-icon>
        </button>

        <!-- Submenu Items (indented ~24px, collapsible) -->
        <div
          class="submenu-list"
          [class.expanded]="isGroupExpanded(item.label) && (!collapsed || isMobileOpen)"
          [attr.aria-hidden]="!isGroupExpanded(item.label)"
        >
          <a
            *ngFor="let child of item.children"
            [routerLink]="child.path"
            class="submenu-item"
            role="menuitem"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: false }"
            (click)="onSubmenuClick(child, item)"
            [ngClass]="{ active: selectedMenu === child.label }"
            [attr.aria-current]="selectedMenu === child.label ? 'page' : null"
          >
            <span class="submenu-icon-wrap" *ngIf="child.icon">
              <mat-icon class="submenu-icon" [svgIcon]="child.icon"></mat-icon>
            </span>
            <span class="submenu-bullet" *ngIf="!child.icon"></span>
            <span class="submenu-label">{{ child.label }}</span>
          </a>
        </div>
      </div>
    </ng-container>
  </nav>

  <!-- Footer -->
  <footer class="side-bottom" *ngIf="!collapsed || isMobileOpen">
    <p class="app-version">
      <span class="version-label">v{{ appVersion }}</span>
      <span class="copyright">&copy; 2026 Profluent Labs</span>
    </p>
  </footer>

  <ng-content></ng-content>
</aside>
